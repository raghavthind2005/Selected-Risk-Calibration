input_list: conf/runs/second_certification.inputs.json
expected:
  question: do the 40 certification fixed rows still control selected violation risk when each
    is re-certified on 300 objectives that have never existed
  claim_authority: a second independent draw for C2. It is a certification, not a
    selection; it says nothing about C3 equal-cost superiority or about C4 shape necessity
  namespace_contract: 300 new D_cert objectives per tree at 60 per law in a fresh
    salt family, with zero UID and zero weight overlap against all four objective
    roles of all sixteen source trees, every diagnostic family drawn since, the historical
    census blooms and the spent seed-3..9 namespaces
  context_contract: each tree's fitted surrogate, both point clouds and every correction
    scalar are reused bitwise from its sealed fit_state.npz; nothing is refitted and
    no sealed tree is written
  fixed_row_contract: the 40 rows are read from the identity-only data/earlier_run.json
    asset, re-checked field for field against each tree's frozen_policies.json, and
    their methods rebuilt from the frozen fit. No row is selected, no knob is derived,
    and the ledger carries no risk, count, severity or cost field
  blindness_contract: this process never reads a historical D_prop/D_cert/D_perf outcome,
    the candidate locks, or any earlier outcome table; the input ledger refuses
    them as declared inputs
  certification_contract: 40 fixed rows x 300 fresh objectives, exact one-sided Clopper-Pearson
    at delta_row .00125, each counting against K=40 for .95 simultaneous coverage,
    reported against the registered .12 target with no result-based stopping
  inference_contract: the seed is the resampling unit. Per-domain cluster means and
    percentile-bootstrap intervals over the eight seeds are reported next to the row
    counts; anchors inside a seed are never treated as independent replicates
  solver_contract: 500 deterministic starts with common random numbers across the
    fixed rows of one tree, the frozen 20/100/500 ladder, and per-objective constraint-at-x*,
    correction-at-x*, solver feasibility, true h and ladder feasibility saved
  science_gate: none. Every row, risk, bound and failure set is handed back as measured;
    no row is dropped and no threshold is moved after the fact
server: 
remote_dir: 
command:  -u LLM-SR/scripts/run_earlier_run.py
  runs=second_certification runs.jobs=64
smoke:
  n_fixedcert_per_law: 1
  claim_budgets:
  - 2
  - 3
  - 4
  max_evaluation_cells: 200
  source_runs:
  - methane_seed3
  - williams_seed3
numerical_environment:
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  PYTHONHASHSEED: '0'
  NPY_DISABLE_CPU_FEATURES: AVX512F
  OPENBLAS_CORETYPE: Cooperlake
run_id: job-earlier_run-0831-160430
