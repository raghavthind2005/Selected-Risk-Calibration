expected:
  question: on fresh methane seed-3 roles, does one exact frozen policy per anchor
    certify selected risk and beat strong controls at its measured D_perf cost
  claim_authority: formal fixed-seed evidence for C2/C3/C4; no cross-seed conclusion
    before seeds 3-10 complete
  release_contract: the certification chain production chain is SHA-bound, local_canonical, independently
    verified, check-closed and screened PASS before any fit or solve
  split_contract: six pre-registered mutually exclusive roles reproduce the v2 digests
    with zero historical, cross-role, cross-domain or seed-4 overlap
  policy_contract: D_match freezes seven fields; D_prop selects only among those records;
    D_cert and D_perf-primary carry the selected record bitwise
  cost_contract: all controls match the selected policy's measured D_perf cost within
    1%, or remain honestly unresolved/proven_unavailable outside the risk denominator
  randomized_contract: locked endpoint-weighted expectation is primary and hash realization
    is sensitivity in a separate table
  certification_contract: 3 fixed rows x 300 fresh objectives at delta_row .00125,
    each counts against K=40 and reports the .12 target without result-based stopping
  resume_contract: objective-level checkpoints and bounded one-hour child segments
    resume without recomputing completed cells
  finalization_contract: the bound launcher seals 0444/0555, clears ACLs, rescans
    after 12 seconds, writes an external sidecar, and exits zero before fresh-root
    local verification
  science_gate: none; every lambda/risk/availability/control direction is handed back
    without changing the matrix
